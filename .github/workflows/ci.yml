name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Biome lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: biomejs/setup-biome@v2
        with:
          version: "2.6.8"
      - run: biome lint --error-on-warnings Pipak.js tests/

  test:
    name: Node.js tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check Scriptable script syntax
        run: node --input-type=module --check < Pipak.js
      - name: Run timeline tests
        run: node --test tests/*.test.mjs
